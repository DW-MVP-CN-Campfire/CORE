name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Lint
        run: |
          set -Eeuo pipefail
          npm run lint

      - name: Test
        run: |
          set -Eeuo pipefail
          npm test
